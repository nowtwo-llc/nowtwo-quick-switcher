name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 22 floats to the newest 22.x, which is what clears jsdom 30's floor of
      # ^22.22.2 || ^24.15.0 || >=26.0.0. Pinning a specific 22.x below 22.22.2
      # would fail with "webidl.util.markAsUncloneable is not a function"
      # before any test runs.
      #
      # A matrix would add nothing here: src/ contains no Node API at all and
      # the package has no runtime dependencies, so the extra legs would only
      # re-test vitest and jsdom, not this library.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # lint:check adds --max-warnings=0, so a warning fails the build rather
      # than scrolling past in the log.
      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      # The suite imports from src/, so it cannot catch a build or packaging
      # change that breaks what consumers actually receive.
      - name: Verify built artifacts
        run: npm run verify:dist

      # The demo is deployed from this repo, so a break in it is a break in
      # the project's public landing page.
      - name: Build demo
        run: npm run build:demo
