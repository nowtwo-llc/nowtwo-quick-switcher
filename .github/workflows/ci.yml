name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # engines declares Node >= 20, so verify against every supported major
    # rather than a single version.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      # The suite imports from src/, so it cannot catch a build or packaging
      # change that breaks what consumers actually receive.
      - name: Verify built artifacts
        run: npm run verify:dist

      # The demo is deployed from this repo, so a break in it is a break in
      # the project's public landing page.
      - name: Build demo
        run: npm run build:demo
