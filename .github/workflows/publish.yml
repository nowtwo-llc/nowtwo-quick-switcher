name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC). No NPM_TOKEN secret is used.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships npm 11.x, but
      # upgrade explicitly so a runner image change cannot silently regress to
      # a version that falls back to token auth and fails.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck the published declarations
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG)." >&2
            exit 1
          fi

      # prepublishOnly runs the build, so dist/ does not need to be committed.
      # Provenance is generated automatically under trusted publishing.
      - name: Publish to npm
        run: npm publish
