name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # id-token for npm trusted publishing (OIDC); packages for the
  # GitHub Packages mirror.
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships npm 11.x, but
      # upgrade explicitly so a runner image change cannot silently regress to
      # a version that falls back to token auth and fails.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck the published declarations
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG)." >&2
            exit 1
          fi

      # prepublishOnly runs the build, so dist/ does not need to be committed.
      # Provenance is generated automatically under trusted publishing.
      - name: Publish to npm
        run: npm publish

      # ---- GitHub Packages mirror -------------------------------------
      # Secondary copy for internal use. npm above is the canonical source,
      # so a mirror failure must not fail an otherwise-good release; it
      # surfaces as a warning on the run instead.

      - name: Point npm at GitHub Packages
        if: success()
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@nowtwo-llc'

      - name: Publish to GitHub Packages
        if: success()
        continue-on-error: true
        # publishConfig.registry wins over a --registry flag, so it has to be
        # rewritten rather than overridden on the command line.
        run: |
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm publish
          npm pkg set publishConfig.registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
