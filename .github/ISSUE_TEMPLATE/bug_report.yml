name: Bug report
description: Something isn't working the way it should
labels: [bug]

body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: >-
        The smallest searchCallback that shows the problem. A link to a
        runnable example is ideal.
      render: javascript
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Quick Switcher version
      placeholder: 4.0.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 142, Safari 18.4
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which build are you using?
      options:
        - ESM (import)
        - UMD / script tag global
        - Not sure
    validations:
      required: true
